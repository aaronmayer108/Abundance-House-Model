<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abundance House — Financial Model</title>
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-bg: #ffffff;
    --color-bg-secondary: #f5f5f3;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #5f5e5a;
    --color-text-tertiary: #888780;
    --color-border: rgba(0,0,0,0.10);
    --color-border-secondary: rgba(0,0,0,0.20);
    --radius-md: 10px;
    --radius-lg: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --rainbow: linear-gradient(90deg,#ff0055,#ff6600,#ffdd00,#00cc44,#0088ff,#aa00ff);
    --thumb-size: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1c1c1a;
      --color-bg-secondary: #252523;
      --color-text-primary: #eeecea;
      --color-text-secondary: #a8a7a0;
      --color-text-tertiary: #6e6d69;
      --color-border: rgba(255,255,255,0.09);
      --color-border-secondary: rgba(255,255,255,0.16);
    }
  }

  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text-primary);
    padding: 2rem 1rem;
    min-height: 100vh;
  }
  .container { max-width: 860px; margin: 0 auto; position: relative; z-index: 0; }

  /* ── Title ── */
  h1 {
    font-size: 22px; font-weight: 600; margin-bottom: 0.25rem;
    color: var(--color-text-primary);
  }
  .subtitle { font-size: 13px; color: var(--color-text-tertiary); margin-bottom: 1.5rem; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab-btn {
    padding: 6px 18px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--color-border-secondary);
    background: var(--color-bg);
    color: var(--color-text-secondary);
    cursor: pointer; font-size: 13px; font-weight: 500; font-family: var(--font);
    transition: all 0.15s;
  }
  .tab-btn.active {
    color: var(--color-text-primary);
    border-color: transparent;
    background-image: linear-gradient(var(--color-bg-secondary), var(--color-bg-secondary)), var(--rainbow);
    background-origin: border-box; background-clip: padding-box, border-box;
    border: 2px solid transparent;
  }
  .tab-btn.add-btn { border-style: dashed; }
  .tab-btn:hover { background: var(--color-bg-secondary); }

  /* ── Scenario ── */
  .scenario { display: none; }
  .scenario.active { display: block; }

  /* ── Section titles ── */
  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    margin: 1.5rem 0 0.75rem;
    color: var(--color-text-tertiary);
    display: block;
  }

  /* ── Knobs ── */
  .knobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .knob {
    border-radius: var(--radius-md); padding: 14px 16px;
    border: 1.5px solid transparent;
    background-image: linear-gradient(var(--color-bg-secondary), var(--color-bg-secondary)), var(--rainbow);
    background-origin: border-box; background-clip: padding-box, border-box;
    transition: box-shadow 0.2s;
  }
  .knob:hover { box-shadow: 0 4px 18px rgba(83,74,183,0.15); }
  .knob-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .knob-label { font-size: 13px; color: var(--color-text-secondary); }
  .knob-value {
    font-size: 14px; font-weight: 600; min-width: 80px; text-align: right;
    color: var(--color-text-primary);
  }
  .info-btn { background: none; border: none; padding: 0 2px; cursor: pointer; font-size: 12px; color: var(--color-text-tertiary); opacity: 0.55; line-height: 1; vertical-align: middle; font-family: var(--font); transition: opacity 0.15s; }
  .info-btn:hover { opacity: 1; }
  .knob-help { display: none; font-size: 12px; color: var(--color-text-tertiary); line-height: 1.55; margin-bottom: 10px; }
  .knob-help.visible { display: block; }

  /* ══ SLIDERS ══ */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #b8daf7, #7db8ef);
    outline: none; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: var(--thumb-size); height: var(--thumb-size);
    border-radius: 50%;
    border: 2.5px solid #7db8ef;
    background: var(--color-bg);
    box-shadow: 0 2px 10px rgba(125,184,239,0.4);
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.25);
    box-shadow: 0 3px 18px rgba(125,184,239,0.6);
  }
  input[type=range]::-moz-range-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, #b8daf7, #7db8ef);
  }
  input[type=range]::-moz-range-thumb {
    width: var(--thumb-size); height: var(--thumb-size);
    border-radius: 50%; border: 2.5px solid #7db8ef;
    background: var(--color-bg);
    box-shadow: 0 2px 10px rgba(125,184,239,0.4);
    cursor: pointer;
  }

  /* ── Metrics ── */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 0.75rem; }
  .metric {
    border-radius: var(--radius-md); padding: 14px 16px;
    border: 1.5px solid transparent;
    background-image: linear-gradient(var(--color-bg-secondary), var(--color-bg-secondary)), var(--rainbow);
    background-origin: border-box; background-clip: padding-box, border-box;
  }
  .metric-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 4px; }
  .metric-value {
    font-size: 22px; font-weight: 600; line-height: 1.2;
    color: var(--color-text-primary);
  }
  .metric-sub { font-size: 11px; color: var(--color-text-tertiary); margin-top: 3px; }

  /* ── Divider ── */
  .divider { border: none; height: 2px; margin: 1.5rem 0; background: var(--rainbow); border-radius: 1px; opacity: 0.5; }

  /* ── Distribution pills ── */
  .dist-row { display: flex; gap: 6px; margin-top: 0.75rem; flex-wrap: wrap; }
  .dist-pill { flex: 1; min-width: 70px; border-radius: var(--radius-md); padding: 8px 10px; text-align: center; font-size: 12px; font-weight: 500; }
  .pill-fail    { background: #F1EFE8; color: #444441; }
  .pill-modest  { background: #FEF3E2; color: #7A4B00; }
  .pill-good    { background: #EAF3DE; color: #3B6D11; }
  .pill-great   { background: #E6F1FB; color: #0C447C; }
  .pill-outlier { background: #F3E8FF; color: #5B21B6; }
  @media (prefers-color-scheme: dark) {
    .pill-fail    { background: #2C2C2A; color: #B4B2A9; }
    .pill-modest  { background: #2C1F00; color: #F0B429; }
    .pill-good    { background: #173404; color: #C0DD97; }
    .pill-great   { background: #042C53; color: #B5D4F4; }
    .pill-outlier { background: #1E0A3C; color: #C084FC; }
  }
  .pill-label { font-size: 10px; font-weight: 400; opacity: 0.7; margin-bottom: 2px; }
  .quality-labels { position: relative; height: 18px; margin-top: 5px; }
  .quality-labels span { position: absolute; font-size: 10px; color: var(--color-text-tertiary); transform: translateX(-50%); white-space: nowrap; }

  /* ── Pro-rata toggle ── */
  .toggle-row { display: flex; align-items: center; gap: 10px; }
  .toggle-switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-slider {
    position: absolute; inset: 0; border-radius: 22px;
    background: var(--color-border-secondary);
    cursor: pointer; transition: background 0.2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 16px; height: 16px; border-radius: 50%;
    left: 3px; top: 3px;
    background: white;
    transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle-switch input:checked + .toggle-slider { background: #534AB7; }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
  .prorata-sub { margin-top: 12px; display: none; }
  .prorata-sub.visible { display: block; }

  /* ── Compare ── */
  .compare-section-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-bottom: 0.75rem; }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 0.75rem; }
  .compare-card {
    border-radius: var(--radius-lg); padding: 14px 16px;
    border: 1.5px solid transparent;
    background-image: linear-gradient(var(--color-bg), var(--color-bg)), var(--rainbow);
    background-origin: border-box; background-clip: padding-box, border-box;
  }
  .compare-card-title { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 8px; }
  .compare-metric { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; border-bottom: 0.5px solid var(--color-border); }
  .compare-metric:last-child { border-bottom: none; }
  .compare-key { font-size: 12px; color: var(--color-text-secondary); }
  .compare-val { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }

/* ── Timeline chart ── */
  .chart-wrap { position: relative; height: 200px; margin-top: 1rem; }

/* ── Pineapple background ── */
  #pineapple-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
  }
  #pineapple-bg span {
    position: absolute; user-select: none; line-height: 1;
    animation: float linear infinite;
  }
  @keyframes float {
    0%   { transform: translateY(0)   rotate(var(--r0)); }
    50%  { transform: translateY(-18px) rotate(var(--r1)); }
    100% { transform: translateY(0)   rotate(var(--r0)); }
  }
</style>
</head>
<body>
<div id="pineapple-bg" aria-hidden="true"></div>
<div class="container">
  <h1>Abundance House — financial model</h1>
  <p class="subtitle">Adjust the knobs to model your residency program. Add up to 4 scenarios to compare side by side.</p>
  <div class="tabs" id="tabs"></div>
  <div id="scenarios"></div>
  <hr class="divider">
  <p class="compare-section-title">Scenario comparison</p>
  <div class="compare-grid" id="compare"></div>
</div>

<script>
const fmt = n => n >= 1e9 ? `$${(n/1e9).toFixed(2)}B` : n >= 1e6 ? `$${(n/1e6).toFixed(1)}M` : n >= 1e3 ? `$${(n/1e3).toFixed(0)}K` : `$${Math.round(n)}`;

let scenarios = [{name:'Scenario A'},{name:'Scenario B'}];
let activeIdx = 0;
let states = [];
let charts = {};

function defaultState() {
  return { duration:1, equity:1, founders:12, residencies:3, outcome:100, quality:50, improvement:2, fanciness:25, personnel:100, discount:50, dilution:65, proRata:false, proRataThreshold:0, proRataCheck:150 };
}

// Anchors: implied-worst at 0, Poor at 25, Average at 50, Strong at 75, Exceptional at 100
const QUALITY_ANCHORS = [
  [84.5, 10,   4,  1,  0.5], // implied worst (extrapolated)
  [75.5, 14,   7,  3,  0.5], // Poor
  [66.5, 18,  10,  5,  0.5], // Average
  [50.5, 25,  15,  8,  1.5], // Strong
  [37,   28,  20, 12,  3  ], // Exceptional
];
const ANCHOR_T = [0, 25, 50, 75, 100];
const TIER_RETURNS = [0, 2, 10, 35, 100];

function qualityDist(q) {
  let lo = ANCHOR_T.length - 2;
  for (let k = 0; k < ANCHOR_T.length - 1; k++) {
    if (q <= ANCHOR_T[k + 1]) { lo = k; break; }
  }
  const hi = lo + 1;
  const frac = (q - ANCHOR_T[lo]) / (ANCHOR_T[hi] - ANCHOR_T[lo]);
  return QUALITY_ANCHORS[lo].map((v, j) => v + (QUALITY_ANCHORS[hi][j] - v) * frac);
}

// ── Improvement rate ──────────────────────────────────────────
const IMPROVEMENT_RATES = [0.05, 0.10, 0.20, 0.35]; // Modest, Steady, Strong, Aggressive

function improvementRate(v) {
  if (v >= 4) return IMPROVEMENT_RATES[3];
  const lo = Math.floor(v) - 1;
  const frac = v - Math.floor(v);
  return IMPROVEMENT_RATES[lo] + (IMPROVEMENT_RATES[lo + 1] - IMPROVEMENT_RATES[lo]) * frac;
}

function fmtImprovement(v) {
  return (improvementRate(v) * 100).toFixed(0) + '%/yr';
}

// ─────────────────────────────────────────────────────────────
function calcTimeline(s) {
  const rate = improvementRate(s.improvement);
  let cumulative = 0;
  return Array.from({ length: 10 }, (_, t) => {
    const quality = 100 - (100 - s.quality) * Math.pow(1 - rate, t);
    const equity  = Math.min(5,    s.equity  * Math.pow(1 + rate / 2, t));
    const outcome = Math.min(1000, s.outcome  * Math.pow(1 + rate, t));
    cumulative += calcMetrics({ ...s, quality, equity, outcome }).totalValue;
    return cumulative;
  });
}

function calcMetrics(s) {
  const maxRes = s.duration===3 ? 4 : s.duration===2 ? 6 : 12;
  const res = Math.min(s.residencies, maxRes);
  const dist = qualityDist(s.quality);
  const ev = dist.reduce((sum, pct, j) => sum + (pct / 100) * TIER_RETURNS[j], 0);

  let valuePerFounder, proRataCapital = null, proRataPortfolioValue = null;

  if (s.proRata) {
    const qualifyingMin = parseFloat(s.proRataThreshold || 0) >= 0.5 ? 2 : 3;
    const effDilution = Math.max(0, s.dilution - 20);
    valuePerFounder = dist.reduce((sum, pct, j) => {
      const dil = j >= qualifyingMin ? effDilution : s.dilution;
      return sum + (pct / 100) * TIER_RETURNS[j] * s.outcome * 1e6 * (s.equity / 100) * (1 - dil / 100) * (1 - s.discount / 100);
    }, 0);
    const qualifyingPct = dist.slice(qualifyingMin).reduce((a, p) => a + p, 0) / 100;
    proRataCapital = qualifyingPct * s.founders * res * (s.proRataCheck || 150) * 1000;
  } else {
    valuePerFounder = s.outcome*1e6 * ev * (s.equity/100) * (1 - s.dilution/100) * (1 - s.discount/100);
  }

  const equityPerBatch = s.founders * (s.equity/100);
  const batchValue = s.founders * valuePerFounder;
  const totalValue = res * batchValue;
  const baseCost = 25000 + (s.founders - 12) * 2000;
  const costPerMonth = Math.max(5000, baseCost) * (s.fanciness / 25);
  const costPerResidency = costPerMonth * s.duration + (s.personnel * 1000 / res);
  const totalCost = costPerResidency * res;

  if (s.proRata) proRataPortfolioValue = totalValue - proRataCapital;

  return { res, dist, ev, equityPerBatch, batchValue, totalValue, costPerResidency, totalCost, proRataCapital, proRataPortfolioValue };
}

function maxResForDur(dur) { return dur===3 ? 4 : dur===2 ? 6 : 12; }

function qualityPills(dist) {
  const labels  = ['Fail', 'Modest', 'Good', 'Great', 'Outlier'];
  const classes = ['pill-fail', 'pill-modest', 'pill-good', 'pill-great', 'pill-outlier'];
  return labels.map((label, j) =>
    `<div class="dist-pill ${classes[j]}"><div class="pill-label">${label} (${TIER_RETURNS[j]}×)</div>${dist[j].toFixed(0)}%</div>`
  ).join('');
}

function buildMetrics(m, tenYearValue) {
  const proRataCards = m.proRataCapital != null ? `
    <div class="metric"><div class="metric-label">Pro-rata capital required</div><div class="metric-value">${fmt(m.proRataCapital)}</div><div class="metric-sub">Total follow-on deployment</div></div>
    <div class="metric"><div class="metric-label">Pro-rata adjusted value</div><div class="metric-value">${fmt(m.proRataPortfolioValue)}</div><div class="metric-sub">Portfolio value net of follow-on cost</div></div>
  ` : '';
  return `
    <div class="metric"><div class="metric-label">Yearly portfolio value</div><div class="metric-value">${fmt(m.totalValue)}</div><div class="metric-sub">${m.res} residencies · year 1 baseline</div></div>
    <div class="metric"><div class="metric-label">10-year portfolio value</div><div class="metric-value">${fmt(tenYearValue)}</div><div class="metric-sub">Cumulative · incl. improvement rate</div></div>
    <div class="metric"><div class="metric-label">Value per batch</div><div class="metric-value">${fmt(m.batchValue)}</div><div class="metric-sub">Gross equity per cohort</div></div>
    <div class="metric"><div class="metric-label">Cost per residency</div><div class="metric-value">${fmt(m.costPerResidency)}</div><div class="metric-sub">Incl. personnel allocation</div></div>
    <div class="metric"><div class="metric-label">Total annual cost</div><div class="metric-value">${fmt(m.totalCost)}</div><div class="metric-sub">All residencies + personnel</div></div>
    ${proRataCards}`;
}

function knobHTML(key, label, val, min, max, step, fmtFn, help) {
  const infoBtn  = help ? ` <button class="info-btn" onclick="this.closest('.knob').querySelector('.knob-help').classList.toggle('visible')" aria-label="Info">ⓘ</button>` : '';
  const helpHtml = help ? `\n    <p class="knob-help">${help}</p>` : '';
  return `<div class="knob">
    <div class="knob-header">
      <span class="knob-label">${label}${infoBtn}</span>
      <span class="knob-value" id="kv-${key}">${fmtFn(val)}</span>
    </div>${helpHtml}
    <input type="range" min="${min}" max="${max}" step="${step}" value="${val}" data-key="${key}" data-fmt-id="${key}">
  </div>`;
}

function buildScenario(s, m, i) {
  const mr = maxResForDur(s.duration);
  return `
    <p class="section-title">Structure</p>
    <div class="knobs">
      ${knobHTML('duration','Duration (months)',s.duration,1,3,1,v=>v+' mo',"How many months each residency runs. Longer residencies build deeper founder relationships but limit how many batches you can run per year.")}
      ${knobHTML('equity','Equity charge',s.equity,0.1,5,0.1,v=>v+'%',"The percentage of each founder's company you take in exchange for the residency. This is your starting point in year 1 — it grows as your program's reputation improves.")}
      ${knobHTML('founders','Founders per batch',s.founders,8,40,1,v=>v+' founders',"How many founders join each cohort. More founders means more equity but also higher costs and potentially lower intimacy.")}
      ${knobHTML('residencies','Residencies per year',Math.min(s.residencies,mr),1,mr,1,v=>v+'/yr',"How many batches you run annually. Automatically capped based on duration (a 3-month residency can run at most 4 times per year).")}
    </div>
    <p class="section-title">Selection quality</p>
    <div class="knob">
      <div class="knob-header">
        <span class="knob-label">Selection quality <button class="info-btn" onclick="this.closest('.knob').querySelector('.knob-help').classList.toggle('visible')" aria-label="Info">ⓘ</button></span>
        <span class="knob-value">${Math.round(s.quality)}</span>
      </div>
      <p class="knob-help">How good you are at identifying and attracting high-potential founders. This shifts the entire outcome distribution: better selection compresses the fail bucket and inflates the good and great buckets. Based on a realistic 5-tier startup outcome model (Fail at 0×, Modest at 2×, Good at 10×, Great at 35×, Outlier at 100×). Improves over time based on your improvement rate.</p>
      <input type="range" min="1" max="100" step="1" value="${s.quality}" data-key="quality">
      <div class="quality-labels">
        <span style="left:24.2%">Poor</span>
        <span style="left:49.5%">Average</span>
        <span style="left:74.7%">Strong</span>
        <span style="left:100%;transform:translateX(-100%)">Exceptional</span>
      </div>
    </div>
    <div class="dist-row" id="dist-${i}">${qualityPills(m.dist)}</div>
    <div class="knobs" style="margin-top:12px">
      ${knobHTML('outcome','Expected exit value',s.outcome,10,1000,10,v=>'$'+v+'M',"The estimated value of a founder's company at exit if they succeed, in today's dollars. This is not the expected value of a random company — it's your assumption about what a successful Abundance House company looks like at year 7. Think of it as your target company profile.")}
      <div class="knob">
        <div class="knob-header">
          <span class="knob-label">Program improvement rate <button class="info-btn" onclick="this.closest('.knob').querySelector('.knob-help').classList.toggle('visible')" aria-label="Info">ⓘ</button></span>
          <span class="knob-value">${fmtImprovement(s.improvement)}</span>
        </div>
        <p class="knob-help">How fast your program gets better over time. This compounds annually and affects three things simultaneously: your selection quality improves (better founders apply as reputation grows), the equity you can charge increases (stronger brand = more leverage), and expected founder outcomes rise (better founders build bigger companies). Modest = 5%/yr, Steady = 10%/yr, Strong = 20%/yr, Aggressive = 35%/yr.</p>
        <input type="range" min="1" max="4" step="0.01" value="${s.improvement}" data-key="improvement">
        <div class="quality-labels">
          <span style="left:0%;transform:none">Modest</span>
          <span style="left:33.3%">Steady</span>
          <span style="left:66.7%">Strong</span>
          <span style="left:100%;transform:translateX(-100%)">Aggressive</span>
        </div>
      </div>
    </div>
    <p class="section-title">Costs</p>
    <div class="knobs">
      ${knobHTML('fanciness','Fanciness ($/month baseline)',s.fanciness,25,100,5,v=>'$'+v+'k/mo',"The baseline monthly cost of running the physical residency experience, per month. At $25k/month (baseline) you're running a high-quality but modest house. At $100k/month you're running a truly exceptional experience. Costs also scale with number of founders — each additional founder above 12 adds $2k/month.")}
      ${knobHTML('personnel','Personnel cost',s.personnel,0,500,25,v=>'$'+v+'k/yr',"Your annual spend on staff, operations, legal, and admin. This is spread across all residencies in the year. Does not include your own time, which is effectively an opportunity cost not modeled here.")}
    </div>
    <p class="section-title">Value adjustments</p>
    <div class="knobs">
      ${knobHTML('discount','Discount rate (NPV haircut)',s.discount,0,100,1,v=>v+'%',"A haircut on the total portfolio value to reflect the time value of money — equity you receive today won't be liquid for 5-10 years, and a dollar in the future is worth less than a dollar now. This should reflect pure time value only, since failure risk is already captured in the outcome distribution. A rate of 50% over 7 years implies roughly a 10% annual discount rate, which is standard for long-horizon illiquid assets.")}
      ${knobHTML('dilution','Dilution assumption',s.dilution,0,100,1,v=>v+'%',"How much your equity stake shrinks as portfolio companies raise future funding rounds. Every time a company raises money, new shares are issued and your percentage ownership decreases. The cruel math of venture: your winners (the ones that raise the most rounds) dilute you the most. A realistic blended default for companies that reach meaningful exits is 60-65%, meaning you retain roughly 35-40% of your original stake at exit.")}
    </div>
    <div class="knob" style="margin-top:12px">
      <div class="knob-header">
        <span class="knob-label">Exercise pro-rata rights <button class="info-btn" onclick="this.closest('.knob').querySelector('.knob-help').classList.toggle('visible')" aria-label="Info">ⓘ</button></span>
        <label class="toggle-switch">
          <input type="checkbox" data-key="proRata"${s.proRata ? ' checked' : ''}>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p class="knob-help">Pro-rata rights let you invest in future funding rounds to maintain your ownership percentage in your best companies. Exercising them costs real capital but reduces dilution on your winners — the companies that matter most. This toggle models the net effect on your portfolio value after accounting for the capital deployed.</p>
      <div class="prorata-sub${s.proRata ? ' visible' : ''}">
        <div class="knobs" style="margin-top:0">
          ${knobHTML('proRataThreshold','Pro-rata threshold',s.proRataThreshold,0,1,1,v=>parseFloat(v)>=0.5?'Good and above':'Great + Outlier',"Which outcome tiers you exercise pro-rata rights in. 'Great + Outlier only' targets your top performers; 'Good and above' casts a wider net but requires more capital.")}
          ${knobHTML('proRataCheck','Avg follow-on check',s.proRataCheck,25,1000,25,v=>parseFloat(v)>=1000?'$1M':'$'+Math.round(v)+'k',"Your average follow-on investment per company you exercise pro-rata in, in today's dollars. This capital comes directly out of your own pocket.")}
        </div>
      </div>
    </div>
    <p class="section-title">Outputs</p>
    <div class="metrics" id="metrics-${i}">${buildMetrics(m, calcTimeline(s).at(-1))}</div>
    <p class="section-title">10-year outlook</p>
    <div class="chart-wrap"><canvas id="chart-${i}"></canvas></div>
    `;
}

const fmtFns = {
  duration:v=>v+' mo', equity:v=>v+'%', founders:v=>v+' founders',
  residencies:v=>v+'/yr', outcome:v=>'$'+v+'M', quality:v=>Math.round(v), improvement:fmtImprovement,
  fanciness:v=>'$'+v+'k/mo', personnel:v=>'$'+v+'k/yr',
  discount:v=>v+'%', dilution:v=>v+'%',
  proRataThreshold:v=>parseFloat(v)>=0.5?'Good and above':'Great + Outlier',
  proRataCheck:v=>parseFloat(v)>=1000?'$1M':'$'+Math.round(v)+'k'
};

function renderAll() {
  const tabsEl = document.getElementById('tabs');
  const scenEl = document.getElementById('scenarios');
  tabsEl.innerHTML = '';
  Object.values(charts).forEach(c => c?.destroy());
  charts = {};
  scenEl.innerHTML = '';

  scenarios.forEach((sc, i) => {
    if (!states[i]) states[i] = defaultState();
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === activeIdx ? ' active' : '');
    btn.textContent = sc.name;
    btn.onclick = () => { activeIdx = i; renderAll(); };
    tabsEl.appendChild(btn);
  });

  if (scenarios.length < 4) {
    const add = document.createElement('button');
    add.className = 'tab-btn add-btn';
    add.innerHTML = '+ Add scenario';
    add.onclick = () => {
      const letters = ['A','B','C','D'];
      scenarios.push({ name: 'Scenario ' + letters[scenarios.length] });
      states.push(defaultState());
      activeIdx = scenarios.length - 1;
      renderAll();
    };
    tabsEl.appendChild(add);
  }

  scenarios.forEach((sc, i) => {
    const s = states[i];
    const m = calcMetrics(s);
    const div = document.createElement('div');
    div.className = 'scenario' + (i === activeIdx ? ' active' : '');
    div.innerHTML = buildScenario(s, m, i);
    scenEl.appendChild(div);

    div.querySelectorAll('input[type=range]').forEach(inp => {
      inp.addEventListener('input', () => {
        const key = inp.dataset.key;
        states[i][key] = parseFloat(inp.value);
        if (key === 'duration') {
          const mr = maxResForDur(states[i].duration);
          if (states[i].residencies > mr) states[i].residencies = mr;
        }
        updateScenario(i);
        updateCompare();
      });
    });
    div.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        const key = cb.dataset.key;
        states[i][key] = cb.checked;
        const sub = cb.closest('.knob')?.querySelector('.prorata-sub');
        if (sub) sub.classList.toggle('visible', cb.checked);
        updateScenario(i);
        updateCompare();
      });
    });
    initChart(i, states[i]);
  });

  updateCompare();
}

function updateScenario(i) {
  const s = states[i];
  const m = calcMetrics(s);
  const sc = document.querySelectorAll('.scenario')[i];
  if (!sc) return;
  sc.querySelectorAll('input[type=range]').forEach(inp => {
    const key = inp.dataset.key;
    const mr = maxResForDur(s.duration);
    if (key === 'residencies') inp.max = mr;
    inp.value = s[key];
    const span = inp.closest('.knob')?.querySelector('.knob-value');
    if (span && fmtFns[key]) span.textContent = fmtFns[key](s[key]);
  });
  sc.querySelectorAll('input[type=checkbox]').forEach(cb => {
    const key = cb.dataset.key;
    cb.checked = !!s[key];
    const sub = cb.closest('.knob')?.querySelector('.prorata-sub');
    if (sub) sub.classList.toggle('visible', !!s[key]);
  });
  const distEl = sc.querySelector('[id^="dist-"]');
  if (distEl) distEl.innerHTML = qualityPills(m.dist);
  const metricsEl = sc.querySelector('[id^="metrics-"]');
  if (metricsEl) metricsEl.innerHTML = buildMetrics(m, calcTimeline(s).at(-1));
  updateChart(i);
}

function updateCompare() {
  document.getElementById('compare').innerHTML = scenarios.map((sc, i) => {
    const m = calcMetrics(states[i] || defaultState());
    return `<div class="compare-card">
      <div class="compare-card-title">${sc.name}</div>
      <div class="compare-metric"><span class="compare-key">Portfolio value</span><span class="compare-val">${fmt(m.totalValue)}</span></div>
      <div class="compare-metric"><span class="compare-key">Per-batch value</span><span class="compare-val">${fmt(m.batchValue)}</span></div>
      <div class="compare-metric"><span class="compare-key">Annual cost</span><span class="compare-val">${fmt(m.totalCost)}</span></div>
    </div>`;
  }).join('');
}

function initChart(idx, s) {
  const ctx = document.getElementById(`chart-${idx}`);
  if (!ctx) return;
  if (charts[idx]) { charts[idx].destroy(); }
  const dark      = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor = dark ? '#a8a7a0' : '#888780';
  const gridColor = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
  charts[idx] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['Y1','Y2','Y3','Y4','Y5','Y6','Y7','Y8','Y9','Y10'],
      datasets: [{
        data: calcTimeline(s),
        borderColor: '#534AB7',
        backgroundColor: 'rgba(83,74,183,0.07)',
        fill: true,
        tension: 0.4,
        pointRadius: 3,
        pointHoverRadius: 6,
        pointBackgroundColor: '#534AB7',
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          displayColors: false,
          callbacks: {
            title: items => `Year ${items[0].label.replace('Y', '')}`,
            label: item  => fmt(item.parsed.y),
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: textColor, font: { size: 11 } },
        },
        y: {
          border: { display: false },
          grid: { color: gridColor },
          ticks: { color: textColor, font: { size: 11 }, callback: v => fmt(v) },
        },
      },
    },
  });
}

function updateChart(idx) {
  const c = charts[idx];
  if (!c) return;
  c.data.datasets[0].data = calcTimeline(states[idx]);
  c.update('none');
}

// Pineapple background
(function() {
  const bg = document.getElementById('pineapple-bg');
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    const size = 28 + Math.random() * 64;
    const opacity = 0.04 + Math.random() * 0.07;
    const r0 = (Math.random() * 40 - 20).toFixed(1) + 'deg';
    const r1 = (Math.random() * 40 - 20).toFixed(1) + 'deg';
    const dur = (6 + Math.random() * 8).toFixed(1) + 's';
    const delay = (Math.random() * -10).toFixed(1) + 's';
    s.textContent = '🍍';
    s.style.cssText = `font-size:${size}px;opacity:${opacity};left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;--r0:${r0};--r1:${r1};animation-duration:${dur};animation-delay:${delay};`;
    bg.appendChild(s);
  }
})();

renderAll();
</script>
</body>
</html>
